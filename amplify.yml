version: 1
backend:
  phases:
    build:
      commands:
        # npm ci rechaza el lockfile por las dependencias empaquetadas de
        # @aws-amplify/data-construct; npm install lo respeta sin modificarlo.
        - npm install --no-audit --no-fund
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*
